name: Flutter CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  analyze_and_test:
    name: Analyze & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Install Dependencies
        working-directory: restaurant_app
        run: flutter pub get

      - name: Static Code Analysis (Lint)
        working-directory: restaurant_app
        run: flutter analyze --fatal-infos

      - name: Run Test Suite with Coverage
        working-directory: restaurant_app
        run: flutter test --coverage

      - name: Build Android Debug APK
        working-directory: restaurant_app
        run: flutter build apk --debug

  release_build:
    name: Build Android Release AppBundle
    needs: analyze_and_test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: restaurant_app
        run: flutter pub get

      - name: Setup Keystore from Secrets (if provided)
        working-directory: restaurant_app
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> android/key.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Build Release Android App Bundle
        working-directory: restaurant_app
        run: |
          flutter build appbundle --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"

      - name: Upload AppBundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: restaurant_app/build/app/outputs/bundle/release/*.aab

      - name: Upload Debug Symbols
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-symbols
          path: restaurant_app/build/app/outputs/symbols/

name: restaurant_app
description: "Enterprise Multi-Role Restaurant Management System (Customer Dine-in/Delivery, Waiter POS, KDS, Driver Live Tracking, and Manager Dashboard) built with Flutter, Riverpod, and Supabase Realtime."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.0

  # Real-time / WebSocket
  web_socket_channel: ^3.0.1

  # Code generation annotations
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Internationalization / formatting
  intl: ^0.20.2

  # Local / secure storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # QR code scanning & generation
  mobile_scanner: ^7.0.0
  qr_flutter: ^4.1.0

  # Image caching
  cached_network_image: ^3.4.1

  # Audio alerts (KDS)
  audioplayers: ^6.0.0

  # Maps & GPS (driver tracking with mhj_maps)
  geolocator: ^13.0.0
  latlong2: ^0.9.1
  mhj_maps: ^1.0.0

  # Image capture (delivery proof)
  image_picker: ^1.1.2

  # Charts & Analytics
  fl_chart: ^0.68.0

  # Typography & Custom Fonts
  google_fonts: ^6.2.1
  supabase_flutter: ^2.17.2

  # Error Monitoring & Crash Reporting
  sentry_flutter: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  uses-material-design: true
